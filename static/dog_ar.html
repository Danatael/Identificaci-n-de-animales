<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AR Perro - Realidad Aumentada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body { 
            margin: 0; 
            background: #000; 
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        /* Video de la cámara como fondo completo */
        #cameraVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1); /* Efecto espejo para cámara frontal */
        }
        
        /* Contenedor para A-Frame superpuesto */
        #arContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: auto; /* Permitir interacciones táctiles */
            touch-action: none; /* Prevenir comportamientos por defecto */
        }
        
        /* A-Frame scene completamente transparente */
        a-scene {
            background: transparent !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        a-scene canvas {
            background: transparent !important;
        }
        
        /* Indicador de selección */
        .selection-indicator {
            position: fixed;
            border: 3px solid #00ff00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.8;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        
        .ar-title { 
            position: fixed; 
            top: 1rem; 
            left: 1rem; 
            color: white; 
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            z-index: 1000;
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .back-btn { 
            position: fixed; 
            top: 1rem; 
            right: 1rem; 
            z-index: 1000; 
            background: rgba(255,255,255,0.9); 
            color: #333; 
            border: none; 
            border-radius: 8px; 
            padding: 0.7rem 1.2rem; 
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }
        
        .back-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .instructions {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            background: rgba(0,0,0,0.7);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 1000;
            max-width: 90%;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        /* Control de posición del modelo */
        .model-controls {
            position: fixed;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: auto;
        }
        
        .control-btn {
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: white;
            transform: scale(1.1);
        }
        
        /* Responsive breakpoints */
        @media (max-width: 768px) {
            .ar-title {
                font-size: 1rem;
                padding: 0.4rem 0.8rem;
                top: 0.5rem;
                left: 0.5rem;
            }
            
            .back-btn {
                padding: 0.6rem 1rem;
                top: 0.5rem;
                right: 0.5rem;
                font-size: 0.9rem;
            }
            
            .instructions {
                bottom: 1rem;
                padding: 0.8rem 1rem;
                font-size: 0.8rem;
            }
            
            .model-controls {
                right: 0.5rem;
                gap: 0.5rem;
            }
        }
        
        /* Soporte para notch en dispositivos móviles */
        @supports (padding-top: env(safe-area-inset-top)) {
            .ar-title {
                top: calc(env(safe-area-inset-top) + 1rem);
            }
            
            .back-btn {
                top: calc(env(safe-area-inset-top) + 1rem);
            }
            
            .instructions {
                bottom: calc(env(safe-area-inset-bottom) + 1rem);
            }
        }
    </style>
</head>
<body>
    <!-- Video de la cámara como fondo -->
    <video id="cameraVideo" autoplay muted playsinline></video>
    
    <!-- Contenedor AR superpuesto -->
    <div id="arContainer">
        <a-scene embedded vr-mode-ui="enabled: false;" background="color: transparent; transparent: true;" renderer="alpha: true; antialias: true;">
            <a-assets>
                <!-- Precargar el modelo -->
            </a-assets>
            
            <!-- Modelo del perro en 3D -->
            <a-entity id="dogModel" 
                      gltf-model="/Controllers/Models/dog_merlin_animals/scene.gltf" 
                      scale="0.1 0.1 0.1" 
                      position="0 -0.5 -2" 
                      rotation="0 180 0"
                      material="transparent: false"
                      visible="false">
            </a-entity>
            
            <!-- Cámara AR -->
            <a-camera position="0 1.6 0" look-controls="enabled: false" wasd-controls="enabled: false">
            </a-camera>
            
            <!-- Sistema de luces mejorado -->
            <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
            <a-light type="directional" position="2 4 2" color="#ffffff" intensity="2" cast-shadow="true"></a-light>
            <a-light type="directional" position="-2 4 2" color="#ffffff" intensity="1.5"></a-light>
            <a-light type="point" position="0 3 -1" color="#ffffff" intensity="1.2"></a-light>
            <a-light type="point" position="1 2 -3" color="#ffeeaa" intensity="0.8"></a-light>
        </a-scene>
    </div>
    
    <!-- UI Elements -->
    <div class="ar-title">🐶 AR: Perro</div>
    <button class="back-btn" onclick="window.location.href='/'">← Regresar</button>
    
    <!-- Controles del modelo -->
    <div class="model-controls">
        <button class="control-btn" onclick="moveModel('up')" title="Subir">↑</button>
        <button class="control-btn" onclick="moveModel('down')" title="Bajar">↓</button>
        <button class="control-btn" onclick="moveModel('closer')" title="Acercar">+</button>
        <button class="control-btn" onclick="moveModel('further')" title="Alejar">-</button>
        <button class="control-btn" onclick="rotateModel('left')" title="Rotar izquierda">↶</button>
        <button class="control-btn" onclick="rotateModel('right')" title="Rotar derecha">↷</button>
    </div>
    
    <div class="instructions">
        🎯 Toca el perro para seleccionarlo y arrastrarlo<br>
        👆 Pellizca con dos dedos para cambiar el tamaño<br>
        🔄 Usa los botones ↶ ↷ para rotarlo<br>
        ⭕ El círculo verde indica que está seleccionado
    </div>

    <script>
        let dogEntity;
        let currentPosition = { x: 0, y: -0.5, z: -2 };
        let currentScale = { x: 0.6, y: 0.6, z: 0.6 };
        let currentRotation = { x: 0, y: 180, z: 0 };
        
        // Variables para gestos táctiles
        let lastTouchDistance = 0;
        let lastTouchCenter = { x: 0, y: 0 };
        let isDragging = false;
        let isPinching = false;
        let isModelSelected = false;
        let selectionIndicator = null;
        
        // Inicializar configuración responsiva
        function initResponsiveModel() {
            const responsivePos = getResponsivePosition();
            const responsiveScale = getResponsiveScale();
            
            currentPosition = responsivePos;
            currentScale = { 
                x: responsiveScale.base, 
                y: responsiveScale.base, 
                z: responsiveScale.base 
            };
            
            if (dogEntity) {
                dogEntity.setAttribute('position', 
                    `${currentPosition.x} ${currentPosition.y} ${currentPosition.z}`);
                dogEntity.setAttribute('scale', 
                    `${currentScale.x} ${currentScale.y} ${currentScale.z}`);
                dogEntity.setAttribute('rotation', 
                    `${currentRotation.x} ${currentRotation.y} ${currentRotation.z}`);
            }
        }
        
        // Obtener distancia entre dos puntos táctiles
        function getTouchDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
        
        // Obtener centro entre dos puntos táctiles
        function getTouchCenter(touch1, touch2) {
            return {
                x: (touch1.clientX + touch2.clientX) / 2,
                y: (touch1.clientY + touch2.clientY) / 2
            };
        }
        
        // Proyectar posición 3D del modelo a coordenadas de pantalla
        function worldToScreen(worldPos) {
            const scene = document.querySelector('a-scene');
            const camera = scene.camera;
            const canvas = scene.canvas;
            
            if (!camera || !canvas) return null;
            
            // Crear vector 3D de la posición del modelo
            const vector = new THREE.Vector3(worldPos.x, worldPos.y, worldPos.z);
            
            // Proyectar a coordenadas de pantalla
            vector.project(camera);
            
            // Convertir a coordenadas de píxeles
            const x = (vector.x * 0.5 + 0.5) * canvas.clientWidth;
            const y = (vector.y * -0.5 + 0.5) * canvas.clientHeight;
            
            return { x: x, y: y, z: vector.z };
        }
        
        // Verificar si un toque está sobre el modelo
        function isTouchOnModel(touchX, touchY) {
            const modelScreen = worldToScreen(currentPosition);
            if (!modelScreen) return false;
            
            // Radio de detección basado en la escala del modelo
            const detectionRadius = 80 * Math.max(currentScale.x, currentScale.y, currentScale.z);
            
            const distance = Math.sqrt(
                Math.pow(touchX - modelScreen.x, 2) + 
                Math.pow(touchY - modelScreen.y, 2)
            );
            
            return distance <= detectionRadius && modelScreen.z < 1; // z < 1 significa que está frente a la cámara
        }
        
        // Crear indicador visual de selección
        function createSelectionIndicator() {
            if (selectionIndicator) {
                document.body.removeChild(selectionIndicator);
            }
            
            selectionIndicator = document.createElement('div');
            selectionIndicator.className = 'selection-indicator';
            selectionIndicator.style.width = '60px';
            selectionIndicator.style.height = '60px';
            document.body.appendChild(selectionIndicator);
        }
        
        // Actualizar posición del indicador de selección
        function updateSelectionIndicator() {
            if (!selectionIndicator || !isModelSelected) return;
            
            const modelScreen = worldToScreen(currentPosition);
            if (modelScreen) {
                selectionIndicator.style.left = (modelScreen.x - 30) + 'px';
                selectionIndicator.style.top = (modelScreen.y - 30) + 'px';
                selectionIndicator.style.display = 'block';
            } else {
                selectionIndicator.style.display = 'none';
            }
        }
        
        // Ocultar indicador de selección
        function hideSelectionIndicator() {
            if (selectionIndicator) {
                selectionIndicator.style.display = 'none';
            }
            isModelSelected = false;
        }
        
        // Convertir coordenadas de pantalla a mundo 3D
        function screenToWorld(screenX, screenY) {
            const sceneEl = document.querySelector('a-scene');
            const canvas = sceneEl.canvas;
            
            // Obtener dimensiones de pantalla
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            // Factor de escala basado en el tamaño de pantalla
            const baseWidth = 375; // iPhone base
            const scaleFactor = Math.min(screenWidth / baseWidth, 1.5);
            
            // Normalizar coordenadas (-1 a 1)
            const x = (screenX / canvas.clientWidth) * 2 - 1;
            const y = -(screenY / canvas.clientHeight) * 2 + 1;
            
            // Proyectar al plano Z del modelo con escala responsiva
            const sensitivity = 0.5 * scaleFactor;
            const worldX = x * Math.abs(currentPosition.z) * sensitivity;
            const worldY = y * Math.abs(currentPosition.z) * sensitivity;
            
            return { x: worldX, y: worldY };
        }

        
        // Obtener escala base responsiva según el dispositivo
        function getResponsiveScale() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const screenDiagonal = Math.sqrt(screenWidth * screenWidth + screenHeight * screenHeight);
            
            // Escalas base para diferentes tamaños de pantalla (reducidas)
            if (screenDiagonal < 700) {
                // Móviles pequeños
                return { base: 0.18, min: 0.01, max: 0.7 };
            } else if (screenDiagonal < 1000) {
                // Móviles grandes / tablets pequeñas
                return { base: 0.22, min: 0.01, max: 1.0 };
            } else if (screenDiagonal < 1400) {
                // Tablets
                return { base: 0.25, min: 0.01, max: 1.2 };
            } else {
                // Desktop
                return { base: 0.3, min: 0.1, max: 1.5 };
            }
        }
        
        // Ajustar posición inicial según pantalla
        function getResponsivePosition() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            
            // Posición Z basada en el tamaño de pantalla
            let z = -2;
            if (screenWidth < 400) {
                z = -1.5; // Más cerca en pantallas pequeñas
            } else if (screenWidth > 1200) {
                z = -3; // Más lejos en pantallas grandes
            }
            
            // Posición Y ajustada para diferentes aspectos de pantalla
            let y = -0.5;
            const aspectRatio = screenWidth / screenHeight;
            if (aspectRatio > 2) {
                y = -0.2; // Pantallas muy anchas
            } else if (aspectRatio < 0.6) {
                y = -0.8; // Pantallas muy altas
            }
            
            return { x: 0, y: y, z: z };
        }
        
        // Manejar inicio de toque
        function handleTouchStart(event) {
            event.preventDefault();
            const touches = event.touches;
            
            if (touches.length === 1) {
                const touch = touches[0];
                
                // Verificar si el toque está sobre el modelo
                if (isTouchOnModel(touch.clientX, touch.clientY)) {
                    isModelSelected = true;
                    createSelectionIndicator();
                    updateSelectionIndicator();
                    isDragging = true;
                } else {
                    // Toque fuera del modelo - deseleccionar
                    hideSelectionIndicator();
                    isDragging = false;
                }
                
                lastTouchCenter = { x: touch.clientX, y: touch.clientY };
            } else if (touches.length === 2) {
                // Dos dedos - preparar pellizco
                isPinching = true;
                isDragging = false;
                lastTouchDistance = getTouchDistance(touches[0], touches[1]);
                lastTouchCenter = getTouchCenter(touches[0], touches[1]);
            }
        }
        
        // Manejar movimiento de toque
        function handleTouchMove(event) {
            event.preventDefault();
            const touches = event.touches;
            
            if (!dogEntity) return;
            
            if (touches.length === 1 && isDragging && !isPinching && isModelSelected) {
                // Arrastrar modelo solo si está seleccionado
                const touch = touches[0];
                const deltaX = touch.clientX - lastTouchCenter.x;
                const deltaY = touch.clientY - lastTouchCenter.y;
                
                const worldDelta = screenToWorld(deltaX, deltaY);
                
                currentPosition.x += worldDelta.x * 0.01;
                currentPosition.y -= worldDelta.y * 0.01;
                
                dogEntity.setAttribute('position', 
                    `${currentPosition.x} ${currentPosition.y} ${currentPosition.z}`);
                
                // Actualizar indicador de selección
                updateSelectionIndicator();
                
                lastTouchCenter = { x: touch.clientX, y: touch.clientY };
                
            } else if (touches.length === 2 && isPinching) {
                // Pellizcar para escalar
                const currentDistance = getTouchDistance(touches[0], touches[1]);
                const distanceRatio = currentDistance / lastTouchDistance;
                
                // Aplicar escala
                currentScale.x *= distanceRatio;
                currentScale.y *= distanceRatio;
                currentScale.z *= distanceRatio;
                
                // Limites de escala responsivos
                const scaleInfo = getResponsiveScale();
                
                currentScale.x = Math.max(scaleInfo.min, Math.min(scaleInfo.max, currentScale.x));
                currentScale.y = Math.max(scaleInfo.min, Math.min(scaleInfo.max, currentScale.y));
                currentScale.z = Math.max(scaleInfo.min, Math.min(scaleInfo.max, currentScale.z));
                
                dogEntity.setAttribute('scale', 
                    `${currentScale.x} ${currentScale.y} ${currentScale.z}`);
                
                lastTouchDistance = currentDistance;
                
                // También mover el modelo con pellizco
                const currentCenter = getTouchCenter(touches[0], touches[1]);
                const centerDelta = {
                    x: currentCenter.x - lastTouchCenter.x,
                    y: currentCenter.y - lastTouchCenter.y
                };
                
                const worldDelta = screenToWorld(centerDelta.x, centerDelta.y);
                
                currentPosition.x += worldDelta.x * 0.01;
                currentPosition.y -= worldDelta.y * 0.01;
                
                dogEntity.setAttribute('position', 
                    `${currentPosition.x} ${currentPosition.y} ${currentPosition.z}`);
                
                lastTouchCenter = currentCenter;
            }
        }
        
        // Manejar fin de toque
        function handleTouchEnd(event) {
            event.preventDefault();
            
            if (event.touches.length === 0) {
                isDragging = false;
                isPinching = false;
                // Mantener selección del modelo hasta el próximo toque
            } else if (event.touches.length === 1 && isPinching) {
                // Cambiar de pellizco a arrastre
                isPinching = false;
                if (isModelSelected) {
                    isDragging = true;
                    lastTouchCenter = { x: event.touches[0].clientX, y: event.touches[0].clientY };
                }
            }
        }
        
        // Inicializar cámara
        async function initCamera() {
            try {
                console.log('Iniciando cámara...');
                const video = document.getElementById('cameraVideo');
                
                // Verificar soporte de getUserMedia
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia no está soportado en este navegador');
                }
                
                // Preferir cámara trasera en móviles para AR
                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' }, // Cámara trasera
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 }
                    }
                };
                
                console.log('Solicitando permisos de cámara...');
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                console.log('Cámara obtenida, configurando video...');
                video.srcObject = stream;
                
                // Asegurar que el video se reproduzca
                video.onloadedmetadata = () => {
                    console.log('Metadata del video cargada');
                    video.play().then(() => {
                        console.log('Video reproduciéndose correctamente');
                        
                        // Ajustar orientación según el tipo de cámara
                        const track = stream.getVideoTracks()[0];
                        if (track) {
                            const settings = track.getSettings();
                            console.log('Configuración de cámara:', settings);
                            
                            if (settings.facingMode === 'user') {
                                // Cámara frontal - efecto espejo
                                video.style.transform = 'scaleX(-1)';
                            } else {
                                // Cámara trasera - normal
                                video.style.transform = 'scaleX(1)';
                            }
                        }
                    }).catch(err => {
                        console.error('Error al reproducir video:', err);
                    });
                };
                
                // Manejar errores de reproducción
                video.onerror = (err) => {
                    console.error('Error en el elemento video:', err);
                };
                
            } catch (err) {
                console.error('Error accessing camera:', err);
                document.querySelector('.instructions').innerHTML = 
                    `❌ Error de cámara: ${err.message}<br>Asegúrate de dar permisos y usar HTTPS`;
                
                // Intentar con cámara frontal como fallback
                if (err.name === 'OverconstrainedError' || err.name === 'NotFoundError') {
                    console.log('Intentando con cámara frontal...');
                    try {
                        const fallbackConstraints = {
                            video: {
                                facingMode: 'user',
                                width: { ideal: 640 },
                                height: { ideal: 480 }
                            }
                        };
                        
                        const fallbackStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                        const video = document.getElementById('cameraVideo');
                        video.srcObject = fallbackStream;
                        video.style.transform = 'scaleX(-1)'; // Espejo para cámara frontal
                        
                        video.onloadedmetadata = () => {
                            video.play();
                            console.log('Cámara frontal funcionando como fallback');
                        };
                        
                    } catch (fallbackErr) {
                        console.error('Error con cámara frontal también:', fallbackErr);
                    }
                }
            }
        }
        
        // Controlar movimiento del modelo
        function moveModel(direction) {
            if (!dogEntity) {
                dogEntity = document.getElementById('dogModel');
            }
            
            const step = 0.3;
            
            switch(direction) {
                case 'up':
                    currentPosition.y += step;
                    break;
                case 'down':
                    currentPosition.y -= step;
                    break;
                case 'closer':
                    currentPosition.z += step;
                    if (currentPosition.z > 0) currentPosition.z = 0; // Límite cerca
                    break;
                case 'further':
                    currentPosition.z -= step;
                    if (currentPosition.z < -5) currentPosition.z = -5; // Límite lejos
                    break;
            }
            
            dogEntity.setAttribute('position', 
                `${currentPosition.x} ${currentPosition.y} ${currentPosition.z}`);
        }
        
        // Controlar rotación del modelo
        function rotateModel(direction) {
            if (!dogEntity) {
                dogEntity = document.getElementById('dogModel');
            }
            
            const rotationStep = 15; // Grados por click
            
            switch(direction) {
                case 'left':
                    currentRotation.y -= rotationStep;
                    break;
                case 'right':
                    currentRotation.y += rotationStep;
                    break;
            }
            
            // Normalizar ángulo (mantener entre 0-360)
            if (currentRotation.y < 0) currentRotation.y += 360;
            if (currentRotation.y >= 360) currentRotation.y -= 360;
            
            dogEntity.setAttribute('rotation', 
                `${currentRotation.x} ${currentRotation.y} ${currentRotation.z}`);
        }
        
        // Inicializar cuando la página carga
        window.addEventListener('load', () => {
            console.log('Página cargada, inicializando...');
            
            // Pequeño delay para asegurar que todo esté listo
            setTimeout(() => {
                initCamera();
            }, 500);
            
            // Obtener referencia al modelo cuando A-Frame esté listo
            document.querySelector('a-scene').addEventListener('loaded', () => {
                dogEntity = document.getElementById('dogModel');
                console.log('Modelo AR cargado');
                
                // Aplicar configuración responsiva inicial
                initResponsiveModel();
                
                // Agregar eventos táctiles al contenedor AR
                const arContainer = document.getElementById('arContainer');

                // --- NUEVO: Colocar o mover el modelo con un clic/toque ---
                function placeModelAtScreen(x, y) {
                    // Si el modelo ya está visible y el toque es sobre el modelo, no mover
                    if (dogEntity.getAttribute('visible') && isTouchOnModel(x, y)) return;
                    // Proyectar a coordenadas del mundo 3D
                    const world = screenToWorld(x, y);
                    currentPosition.x = world.x;
                    currentPosition.y = world.y;
                    dogEntity.setAttribute('position', `${currentPosition.x} ${currentPosition.y} ${currentPosition.z}`);
                    dogEntity.setAttribute('visible', 'true');
                    // Opcional: actualizar instrucciones solo la primera vez
                    if (!window._modelPlacedOnce) {
                        document.querySelector('.instructions').innerHTML = `🎯 Toca el perro para seleccionarlo y arrastrarlo<br>👆 Pellizca con dos dedos para cambiar el tamaño<br>🔄 Usa los botones ↶ ↷ para rotarlo<br>⭕ El círculo verde indica que está seleccionado`;
                        window._modelPlacedOnce = true;
                    }
                }

                // Eventos táctiles para colocar/mover el modelo
                arContainer.addEventListener('touchstart', function(e) {
                    if (e.touches && e.touches.length === 1) {
                        placeModelAtScreen(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, { passive: false });
                arContainer.addEventListener('mousedown', function(e) {
                    placeModelAtScreen(e.clientX, e.clientY);
                }, { passive: false });

                // Eventos táctiles para manipulación del modelo
                arContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
                arContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
                arContainer.addEventListener('touchend', handleTouchEnd, { passive: false });

                // Eventos de mouse para desktop (drag)
                arContainer.addEventListener('mousedown', (e) => {
                    const fakeTouch = { touches: [{ clientX: e.clientX, clientY: e.clientY }] };
                    handleTouchStart(fakeTouch);
                });

                arContainer.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const fakeTouch = { touches: [{ clientX: e.clientX, clientY: e.clientY }] };
                        handleTouchMove(fakeTouch);
                    }
                });

                arContainer.addEventListener('mouseup', (e) => {
                    const fakeTouch = { touches: [] };
                    handleTouchEnd(fakeTouch);
                });

                // Evento de rueda para escalar en desktop
                arContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (!dogEntity) return;
                    const scaleChange = e.deltaY > 0 ? 0.9 : 1.1;
                    currentScale.x *= scaleChange;
                    currentScale.y *= scaleChange;
                    currentScale.z *= scaleChange;
                    // Limites de escala responsivos
                    const scaleInfo = getResponsiveScale();
                    currentScale.x = Math.max(scaleInfo.min, Math.min(scaleInfo.max, currentScale.x));
                    currentScale.y = Math.max(scaleInfo.min, Math.min(scaleInfo.max, currentScale.y));
                    currentScale.z = Math.max(scaleInfo.min, Math.min(scaleInfo.max, currentScale.z));
                    dogEntity.setAttribute('scale', 
                        `${currentScale.x} ${currentScale.y} ${currentScale.z}`);
                }, { passive: false });
            });
        });
        
        // Manejar cambios de orientación
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                const video = document.getElementById('cameraVideo');
                if (video.srcObject) {
                    video.play();
                }
                // Reajustar modelo al cambiar orientación
                initResponsiveModel();
            }, 500);
        });
        
        // Manejar cambios de tamaño de ventana
        window.addEventListener('resize', () => {
            setTimeout(() => {
                initResponsiveModel();
            }, 300);
        });
    </script>
</body>
</html>
